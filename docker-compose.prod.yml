version: "3.9"

services:
  myapp:
    container_name: myapp
    image: yashgoyal1810/myapp:latest
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
